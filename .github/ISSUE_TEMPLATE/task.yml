name: Task
description: A unit of work inside one component
labels: ["type:task"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Component ID from docs/program/components.md, for example C04
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs to happen
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable acceptance criteria, including how it will be verified
    validations:
      required: true
